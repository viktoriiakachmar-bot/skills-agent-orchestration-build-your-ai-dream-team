<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A concise overview of active contributor projects.">
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="dashboard">
      <header class="dashboard-header">
        <p class="eyebrow">Contributor workspace</p>
        <h1>Project Pulse</h1>
        <p class="dashboard-intro">A shared view of the work moving forward and the people guiding it.</p>
      </header>

      <section class="projects-section" aria-labelledby="projects-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Current portfolio</p>
            <h2 id="projects-heading">Active projects</h2>
          </div>
          <p id="project-count" class="project-count" aria-live="polite"></p>
        </div>
        <p id="project-message" class="project-message" aria-live="polite">Loading projects…</p>
        <div id="project-grid" class="project-grid" aria-live="polite" aria-busy="true"></div>
      </section>
    </main>

    <script>
      const requiredProjectFields = ["name", "owner", "status", "recentActivity", "priority"];
      const projectGrid = document.getElementById("project-grid");
      const projectMessage = document.getElementById("project-message");
      const projectCount = document.getElementById("project-count");

      function createMetadataItem(label, value) {
        const wrapper = document.createElement("div");
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        term.textContent = label;
        description.textContent = value;
        wrapper.append(term, description);
        return wrapper;
      }

      function createBadge(label, value, kind) {
        const badge = document.createElement("span");
        badge.className = `badge badge--${kind} badge--${value.toLowerCase().replace(/[^a-z0-9]+/g, "-")}`;
        badge.textContent = `${label}: ${value}`;
        return badge;
      }

      function createProjectCard(project) {
        const card = document.createElement("article");
        card.className = "project-card";

        const cardHeader = document.createElement("header");
        const badges = document.createElement("div");
        badges.className = "badge-row";
        badges.append(
          createBadge("Status", project.status, "status"),
          createBadge("Priority", project.priority, "priority")
        );

        const title = document.createElement("h3");
        title.textContent = project.name;
        cardHeader.append(badges, title);

        const summary = document.createElement("p");
        summary.className = "project-summary";
        summary.textContent = project.summary || "Project details are being coordinated with the team.";

        const metadata = document.createElement("dl");
        metadata.className = "project-metadata";
        metadata.append(
          createMetadataItem("Owner", project.owner),
          createMetadataItem("Recent activity", project.recentActivity)
        );

        card.append(cardHeader, summary, metadata);
        return card;
      }

      function isValidProject(project) {
        return project && typeof project === "object" &&
          requiredProjectFields.every((field) => typeof project[field] === "string" && project[field].trim());
      }

      async function loadProjects() {
        try {
          const response = await fetch("project-data.json");
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          if (!data || !Array.isArray(data.projects)) {
            throw new Error("The project data does not contain a projects array.");
          }

          const projects = data.projects.filter(isValidProject);
          if (projects.length === 0) {
            projectMessage.textContent = "No projects are available right now. Please check back soon.";
            return;
          }

          const fragment = document.createDocumentFragment();
          projects.forEach((project) => fragment.append(createProjectCard(project)));
          projectGrid.append(fragment);
          projectCount.textContent = `${projects.length} active ${projects.length === 1 ? "project" : "projects"}`;
          projectMessage.hidden = true;
        } catch (error) {
          projectMessage.textContent = "We couldn’t load the project overview. Please refresh and try again.";
          console.error("Unable to load project data:", error);
        } finally {
          projectGrid.setAttribute("aria-busy", "false");
        }
      }

      loadProjects();
    </script>
  </body>
</html>
